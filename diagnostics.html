<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>묵주기도 저장 진단</title><link rel="stylesheet" href="./styles.css"><body><main class="shell" style="padding-top:35px"><h1>저장 진단</h1><p class="muted">실제 기도 기록과 분리된 진단 전용 저장소를 사용합니다.</p><div class="actions"><button id="run" class="primary">자동 검사 실행</button><a href="./">앱으로 돌아가기</a></div><p id="summary" role="status"></p><ol id="results" style="line-height:2;font-size:13px"></ol><section class="panel"><h2>Android 갤러리 사진 검사</h2><p class="muted">사진을 선택하면 실제 앱과 같은 저장 경로로 저장하고, 다시 읽어 해시와 표시를 확인합니다. 브라우저를 완전히 닫은 뒤 이 주소를 다시 열고 ‘저장 사진 다시 읽기’를 누르세요. 비행기 모드에서는 앱 본 화면에서 성화를 확인하세요.</p><input id="gallery" type="file" accept="image/jpeg,image/png,image/webp"><button id="reopen" style="margin-top:15px">저장 사진 다시 읽기</button><p id="manualStatus" role="status"></p><img id="manualImage" style="max-width:100%;max-height:450px" alt="진단용 저장 사진" hidden></section><p class="muted">이 검사 통과는 Android 실기기 갤러리·강제 종료·오프라인·업데이트 검증을 대신하지 않습니다.</p><section class="panel"><h2>좁은 화면 미리보기</h2><div class="actions" style="margin:15px 0"><button id="narrow">360px</button><button id="wide">700px</button></div><iframe id="previewFrame" title="모바일 폭 앱 미리보기" src="./" style="width:360px;max-width:100%;height:840px;border:1px solid #ddd"></iframe></section></main><script type="module" src="./diagnostics.js"></script></body></html>
